[project]
name = "mcp-bitcoin"
version = "0.1.0"
description = "MCP server for Bitcoin: HD wallet derivation, chain queries, fee and mempool analysis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jade Naaman" }]
keywords = [
    "bitcoin",
    "mcp",
    "model-context-protocol",
    "bip32",
    "bip39",
    "hd-wallet",
    "electrum",
    "mempool",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=2.0.0",
    "embit>=0.8.0",
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.9.0",
    "python-socks>=2.4.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/junxit/mcp-bitcoin"
Repository = "https://github.com/junxit/mcp-bitcoin"
Issues = "https://github.com/junxit/mcp-bitcoin/issues"
Changelog = "https://github.com/junxit/mcp-bitcoin/blob/main/changelog.txt"

[project.scripts]
mcp-bitcoin = "mcp_bitcoin:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bitcoin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/mcp_bitcoin"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = [
    "B008",    # FastMCP tool signatures use call-time defaults
    "RUF012",  # pydantic model defaults are not ClassVar
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["mcp_bitcoin"]
strict = true
warn_return_any = true
warn_unused_configs = true
# embit ships no type stubs.
[[tool.mypy.overrides]]
module = ["embit.*", "aiohttp_socks.*", "python_socks.*"]
ignore_missing_imports = true
